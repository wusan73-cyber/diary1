<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>아침 일기</title>
<meta name="theme-color" content="#36a89f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="아침 일기">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='s' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23bdeee4'/%3E%3Cstop offset='1' stop-color='%2336a89f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%23e6f5f0'/%3E%3Ccircle cx='50' cy='58' r='20' fill='url(%23s)'/%3E%3Cg stroke='%2336a89f' stroke-width='4' stroke-linecap='round'%3E%3Cline x1='50' y1='20' x2='50' y2='30'/%3E%3Cline x1='24' y1='32' x2='30' y2='38'/%3E%3Cline x1='76' y1='32' x2='70' y2='38'/%3E%3C/g%3E%3Cline x1='14' y1='78' x2='86' y2='78' stroke='%2323807a' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='s' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23bdeee4'/%3E%3Cstop offset='1' stop-color='%2336a89f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%23e6f5f0'/%3E%3Ccircle cx='50' cy='58' r='20' fill='url(%23s)'/%3E%3Cg stroke='%2336a89f' stroke-width='4' stroke-linecap='round'%3E%3Cline x1='50' y1='20' x2='50' y2='30'/%3E%3Cline x1='24' y1='32' x2='30' y2='38'/%3E%3Cline x1='76' y1='32' x2='70' y2='38'/%3E%3C/g%3E%3Cline x1='14' y1='78' x2='86' y2='78' stroke='%2323807a' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"아침 일기","short_name":"아침일기","display":"standalone","background_color":"%23eef9f6","theme_color":"%2336a89f","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%23e6f5f0%27/%3E%3Ccircle cx=%2750%27 cy=%2758%27 r=%2720%27 fill=%27%2336a89f%27/%3E%3Cline x1=%2714%27 y1=%2778%27 x2=%2786%27 y2=%2778%27 stroke=%27%2323807a%27 stroke-width=%275%27 stroke-linecap=%27round%27/%3E%3C/svg%3E","sizes":"any","type":"image/svg+xml"}]}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Fraunces:ital,opsz,wght@1,9..144,300;0,9..144,500&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#d2efe7;
  --sky-mid:#a7dfe0;
  --sun:#36a89f;
  --sun-deep:#23807a;
  --ink:#26433f;
  --ink-soft:#6f928c;
  --paper:#fafffd;
  --paper-line:#dcefe9;
  --card-shadow:rgba(40,130,120,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Gowun Dodum',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(120% 70% at 50% -10%, var(--sky-top) 0%, var(--sky-mid) 38%, #eef9f6 72%, #eef9f6 100%);
  background-attachment:fixed;
  min-height:100vh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 120px;}
header{padding:34px 4px 18px;position:relative;}
.sun-mark{
  width:46px;height:46px;border-radius:14px;
  background:radial-gradient(circle at 50% 60%, #c8f0e8, var(--sun) 70%);
  box-shadow:0 6px 18px rgba(54,168,159,.45);
  display:grid;place-items:center;margin-bottom:16px;
  position:relative;
}
.sun-mark::after{content:"";position:absolute;inset:0;border-radius:14px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);}
.greet{font-size:13px;letter-spacing:.18em;color:var(--sun-deep);font-weight:700;margin-bottom:4px;}
.today{
  font-family:'Gowun Batang',serif;font-weight:700;
  font-size:30px;line-height:1.25;color:var(--ink);
}
.today .en{font-family:'Fraunces',serif;font-style:italic;font-weight:300;color:var(--ink-soft);font-size:18px;display:block;margin-top:2px;}
.streak{
  display:inline-flex;align-items:center;gap:6px;margin-top:14px;
  background:rgba(255,255,255,.6);border:1px solid #bfe9e2;
  padding:7px 14px;border-radius:999px;font-size:13px;color:var(--sun-deep);font-weight:700;
}
.card{
  background:var(--paper);
  border-radius:24px;
  padding:24px 22px;
  margin-top:18px;
  box-shadow:0 18px 40px -18px var(--card-shadow), 0 2px 0 #fff inset;
  border:1px solid #e2f4ef;
}
.label{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:12px;letter-spacing:.02em;}
.label .q{font-family:'Gowun Batang',serif;color:var(--ink);font-size:15px;}
.moods{display:flex;gap:8px;flex-wrap:wrap;}
.mood{
  flex:1;min-width:56px;
  background:#eef8f5;border:2px solid transparent;border-radius:16px;
  padding:12px 4px 9px;cursor:pointer;text-align:center;
  transition:transform .15s, border-color .15s, background .15s;
}
.mood .emo{font-size:28px;line-height:1;display:block;}
.mood .nm{font-size:11px;color:var(--ink-soft);margin-top:6px;}
.mood:active{transform:scale(.93);}
.mood.sel{border-color:var(--sun);background:#fff;box-shadow:0 6px 16px -8px var(--sun);}
.mood.sel .nm{color:var(--sun-deep);font-weight:700;}
textarea,input.line{
  width:100%;border:none;background:transparent;resize:none;
  font-family:'Gowun Dodum',sans-serif;color:var(--ink);font-size:16px;line-height:1.9;
  outline:none;
}
.lined{
  background:
    repeating-linear-gradient(var(--paper) 0 35px, var(--paper-line) 35px 36px);
  border-radius:12px;padding:6px 12px;min-height:180px;
}
.gline{border-bottom:1.5px dashed var(--paper-line);padding:8px 2px;}
.gline:last-child{border-bottom:none;}
input.line{padding:2px 0;}
input.line::placeholder,textarea::placeholder{color:#a7c6bf;}
.save{
  width:100%;margin-top:18px;border:none;cursor:pointer;
  background:linear-gradient(180deg,#4cc4ba,var(--sun-deep));
  color:#fff;font-family:'Gowun Dodum';font-size:17px;font-weight:700;
  padding:16px;border-radius:18px;letter-spacing:.04em;
  box-shadow:0 12px 24px -10px var(--sun-deep);
  transition:transform .12s;
}
.save:active{transform:scale(.98);}
.saved-msg{text-align:center;color:var(--sun-deep);font-size:13px;margin-top:12px;height:16px;font-weight:700;transition:opacity .3s;opacity:0;}
.section-title{
  font-family:'Gowun Batang',serif;font-weight:700;font-size:19px;
  margin:34px 4px 4px;display:flex;align-items:center;gap:8px;
}
.section-title small{font-family:'Gowun Dodum';font-weight:400;font-size:13px;color:var(--ink-soft);}
.entry{
  background:var(--paper);border-radius:18px;padding:16px 18px;margin-top:12px;
  border:1px solid #e2f4ef;box-shadow:0 10px 24px -16px var(--card-shadow);
  cursor:pointer;transition:transform .12s;
}
.entry:active{transform:scale(.99);}
.entry-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.entry-emo{font-size:22px;}
.entry-date{font-family:'Fraunces',serif;font-weight:500;font-size:14px;color:var(--ink);}
.entry-day{font-size:12px;color:var(--ink-soft);margin-left:auto;}
.entry-text{font-size:14px;color:var(--ink-soft);line-height:1.7;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:30px 0;line-height:1.8;}
.tools{display:flex;gap:10px;margin-top:30px;}
.tool-btn{
  flex:1;background:rgba(255,255,255,.7);border:1px solid #bfe9e2;
  border-radius:14px;padding:13px;font-family:'Gowun Dodum';font-size:14px;
  color:var(--sun-deep);font-weight:700;cursor:pointer;transition:transform .12s;
}
.tool-btn:active{transform:scale(.97);}
.hint{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:14px;line-height:1.7;}
.modal-bg{
  position:fixed;inset:0;background:rgba(26,55,50,.45);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center;z-index:50;
}
.modal-bg.on{display:flex;}
.modal{
  background:var(--paper);width:100%;max-width:560px;border-radius:26px 26px 0 0;
  padding:26px 22px calc(26px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;
  animation:up .3s ease;
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.modal h3{font-family:'Gowun Batang',serif;font-size:22px;display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.modal .sub{color:var(--ink-soft);font-size:13px;margin-bottom:18px;}
.modal .field{margin-bottom:16px;}
.modal .field b{font-size:13px;color:var(--sun-deep);display:block;margin-bottom:4px;}
.modal .field p{font-size:15px;line-height:1.8;white-space:pre-wrap;}
.modal-actions{display:flex;gap:10px;margin-top:8px;}
.m-close{flex:1;background:#eef8f5;border:1px solid #bfe9e2;color:var(--ink);padding:14px;border-radius:14px;font-family:'Gowun Dodum';font-weight:700;cursor:pointer;}
.m-del{background:#fff0ec;border:1px solid #ffd4c4;color:#c0573a;padding:14px 18px;border-radius:14px;font-family:'Gowun Dodum';font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="sun-mark">☀️</div>
    <div class="greet" id="greet">좋은 아침이에요</div>
    <h1 class="today" id="todayKo">오늘<span class="en" id="todayEn">Today</span></h1>
    <div class="streak" id="streak">🔥 연속 기록 0일</div>
  </header>
  <div class="card">
    <div class="label"><span class="q">오늘 아침 기분은 어때요?</span></div>
    <div class="moods" id="moods"></div>
  </div>
  <div class="card">
    <div class="label"><span class="q">오늘 감사한 일 한 가지</span></div>
    <div class="gline"><input class="line" id="gratitude" placeholder="작은 것도 좋아요 :)"></div>
  </div>
  <div class="card">
    <div class="label"><span class="q">오늘의 다짐 또는 목표</span></div>
    <div class="gline"><input class="line" id="goal" placeholder="오늘 꼭 해보고 싶은 일"></div>
  </div>
  <div class="card">
    <div class="label"><span class="q">자유롭게 적는 아침 일기</span></div>
    <div class="lined"><textarea id="text" rows="6" placeholder="오늘 아침 떠오른 생각을 적어보세요..."></textarea></div>
    <button class="save" id="saveBtn">오늘 일기 저장하기</button>
    <div class="saved-msg" id="savedMsg">저장되었어요 ☀️</div>
  </div>
  <div class="section-title">지난 일기 <small id="count"></small></div>
  <div id="list"></div>
  <div class="tools">
    <button class="tool-btn" id="backupBtn">⬇️ 백업하기</button>
    <button class="tool-btn" id="restoreBtn">⬆️ 불러오기</button>
    <input type="file" id="fileInput" accept="application/json" style="display:none">
  </div>
  <div class="hint">폰을 바꿀 때는 <b>백업하기</b>로 파일을 저장한 뒤,<br>새 폰에서 이 앱을 열고 <b>불러오기</b>로 그 파일을 선택하면<br>모든 일기가 그대로 옮겨져요.</div>
</div>
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>
<script>
const MOODS=[
  {k:"happy",emo:"😊",nm:"행복"},
  {k:"calm",emo:"😌",nm:"평온"},
  {k:"tired",emo:"😴",nm:"피곤"},
  {k:"excited",emo:"🤩",nm:"설렘"},
  {k:"sad",emo:"😢",nm:"우울"},
  {k:"angry",emo:"😣",nm:"답답"},
];
const KEY="morningDiaryEntries";
let entries=load();
let selMood=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(entries));}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtKo(key){const[y,m,d]=key.split("-");const days=["일","월","화","수","목","금","토"];const date=new Date(y,m-1,d);return `${Number(m)}월 ${Number(d)}일 ${days[date.getDay()]}요일`;}
function fmtEn(key){const[y,m,d]=key.split("-");const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return `${mo[m-1]} ${Number(d)}, ${y}`;}
function moodOf(k){return MOODS.find(m=>m.k===k);}
function renderHeader(){
  const h=new Date().getHours();
  document.getElementById("greet").textContent = h<11?"좋은 아침이에요":h<18?"좋은 오후예요":"좋은 저녁이에요";
  const tk=todayKey();
  document.getElementById("todayKo").childNodes[0].textContent=fmtKo(tk);
  document.getElementById("todayEn").textContent=fmtEn(tk);
  document.getElementById("streak").textContent="🔥 연속 기록 "+calcStreak()+"일";
}
function calcStreak(){
  let s=0;const d=new Date();
  for(;;){
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(entries[k]){s++;d.setDate(d.getDate()-1);}
    else{ if(k===todayKey()){d.setDate(d.getDate()-1);continue;} break;}
  }
  return s;
}
function renderMoods(){
  const box=document.getElementById("moods");box.innerHTML="";
  MOODS.forEach(m=>{
    const b=document.createElement("div");
    b.className="mood"+(selMood===m.k?" sel":"");
    b.innerHTML=`<span class="emo">${m.emo}</span><span class="nm">${m.nm}</span>`;
    b.onclick=()=>{selMood=m.k;renderMoods();};
    box.appendChild(b);
  });
}
function loadToday(){
  const e=entries[todayKey()];
  if(e){
    selMood=e.mood||null;
    document.getElementById("gratitude").value=e.gratitude||"";
    document.getElementById("goal").value=e.goal||"";
    document.getElementById("text").value=e.text||"";
  }
  renderMoods();
}
function save(){
  const tk=todayKey();
  entries[tk]={
    mood:selMood,
    gratitude:document.getElementById("gratitude").value.trim(),
    goal:document.getElementById("goal").value.trim(),
    text:document.getElementById("text").value.trim(),
    savedAt:new Date().toISOString()
  };
  persist();renderHeader();renderList();
  const msg=document.getElementById("savedMsg");msg.style.opacity=1;
  setTimeout(()=>msg.style.opacity=0,1800);
}
function renderList(){
  const keys=Object.keys(entries).sort().reverse();
  document.getElementById("count").textContent=keys.length?`· 총 ${keys.length}편`:"";
  const list=document.getElementById("list");list.innerHTML="";
  if(!keys.length){list.innerHTML='<div class="empty">아직 기록한 일기가 없어요.<br>오늘 아침 첫 일기를 남겨보세요 🌅</div>';return;}
  keys.forEach(k=>{
    const e=entries[k];const m=moodOf(e.mood);
    const preview=e.text||e.gratitude||e.goal||"(내용 없음)";
    const div=document.createElement("div");div.className="entry";
    div.innerHTML=`<div class="entry-head">
        <span class="entry-emo">${m?m.emo:"📝"}</span>
        <span class="entry-date">${fmtEn(k)}</span>
        <span class="entry-day">${fmtKo(k)}</span>
      </div><div class="entry-text">${esc(preview)}</div>`;
    div.onclick=()=>openModal(k);
    list.appendChild(div);
  });
}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function openModal(k){
  const e=entries[k];const m=moodOf(e.mood);
  const modal=document.getElementById("modal");
  modal.innerHTML=`
    <h3>${m?m.emo:"📝"} ${fmtKo(k)}</h3>
    <div class="sub">${fmtEn(k)}${m?" · "+m.nm:""}</div>
    ${e.gratitude?`<div class="field"><b>감사한 일</b><p>${esc(e.gratitude)}</p></div>`:""}
    ${e.goal?`<div class="field"><b>다짐 / 목표</b><p>${esc(e.goal)}</p></div>`:""}
    ${e.text?`<div class="field"><b>아침 일기</b><p>${esc(e.text)}</p></div>`:""}
    <div class="modal-actions">
      <button class="m-close" id="mClose">닫기</button>
      <button class="m-del" id="mDel">삭제</button>
    </div>`;
  document.getElementById("modalBg").classList.add("on");
  document.getElementById("mClose").onclick=closeModal;
  document.getElementById("mDel").onclick=()=>{
    if(confirm(fmtKo(k)+" 일기를 삭제할까요?")){delete entries[k];persist();renderHeader();renderList();closeModal();loadToday();}
  };
}
function closeModal(){document.getElementById("modalBg").classList.remove("on");}
document.getElementById("modalBg").onclick=(e)=>{if(e.target.id==="modalBg")closeModal();};
function backup(){
  const data=JSON.stringify({app:"아침일기",version:1,exportedAt:new Date().toISOString(),entries},null,2);
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="아침일기-백업-"+todayKey()+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function restore(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      const incoming=d.entries||d;
      if(typeof incoming!=="object")throw 0;
      let cnt=0;
      for(const k in incoming){entries[k]=incoming[k];cnt++;}
      persist();renderHeader();renderList();loadToday();
      alert(cnt+"편의 일기를 불러왔어요 ☀️");
    }catch(e){alert("이 파일은 올바른 백업 파일이 아니에요.");}
  };
  r.readAsText(file);
}
document.getElementById("saveBtn").onclick=save;
document.getElementById("backupBtn").onclick=backup;
document.getElementById("restoreBtn").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=(e)=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value="";};
renderHeader();renderList();loadToday();
</script>
</body>
</html>
