<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>이달의 할 일</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#b8552e" />
<!-- iOS 홈화면 앱 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="이달의 할일" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap');
:root{
  --paper:#f4ede0; --card:#fbf6ec; --ink:#2d2620; --soft:#857a6c;
  --accent:#b8552e; --accent-soft:#ecdac9; --done:#5d7a55; --line:#e4d9c6;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif;color:var(--ink);
  background:var(--paper);min-height:100vh;
  padding:env(safe-area-inset-top) 0 0 0;
}
.serif{font-family:'Gowun Batang','Nanum Myeongjo',serif;}
#app{max-width:460px;margin:0 auto;padding:20px 14px calc(110px + env(safe-area-inset-bottom));}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes pop{0%{transform:scale(.5);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
@keyframes sheet{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}
.item{animation:rise .4s both;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;}
button{font-family:inherit;cursor:pointer;}
.arrow{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;}
.pill{display:inline-block;font-size:12.5px;color:var(--soft);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 14px;}
.dayBadge{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:2px 7px;}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;}
.lbl{display:block;font-size:13px;color:var(--soft);margin:12px 2px 6px;}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15.5px;font-family:inherit;color:var(--ink);outline:none;}
.seg{flex:1;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14.5px;}
.seg.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.addBtn{width:100%;margin-top:14px;padding:15px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(184,85,46,.25);}
#overlay{position:fixed;inset:0;background:rgba(45,38,32,.45);display:none;align-items:flex-end;justify-content:center;z-index:50;}
#sheet{width:100%;max-width:460px;background:var(--paper);border-radius:22px 22px 0 0;padding:22px 18px calc(30px + env(safe-area-inset-bottom));animation:sheet .28s ease both;max-height:88vh;overflow-y:auto;}
.mbtn{padding:9px 0;border-radius:9px;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);}
.mbtn.on{background:var(--accent);color:#fff;}
</style>
</head>
<body>
<div id="app"></div>

<div id="overlay"><div id="sheet"></div></div>

<script>
const STORAGE_KEY="monthly_reminders_v1";
const MONTHS_KR=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const compKey=(id,y,m)=>id+"__"+y+"-"+String(m+1).padStart(2,"0");

const SEED=[
  {id:uid(),name:"월세 / 관리비 내기",day:25,everyMonth:true,months:[],note:""},
  {id:uid(),name:"정기 적금 이체 확인",day:5,everyMonth:true,months:[],note:""},
  {id:uid(),name:"구독 서비스 점검 (안 쓰는 거 해지)",day:1,everyMonth:true,months:[],note:""},
  {id:uid(),name:"자동차 보험 갱신",day:10,everyMonth:false,months:[1],note:"매년 2월"},
  {id:uid(),name:"건강검진 예약하기",day:15,everyMonth:false,months:[8],note:""}
];

let tasks=[], completions={};
const now=new Date();
let viewY=now.getFullYear(), viewM=now.getMonth();
let editing=null, fEvery=true, fMonths=[];

function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){const d=JSON.parse(raw);tasks=d.tasks||[];completions=d.completions||{};return;}
  }catch(e){}
  tasks=SEED;completions={};save();
}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({tasks,completions}));}catch(e){}}

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}

function monthTasks(){
  return tasks.filter(t=>t.everyMonth||(t.months||[]).includes(viewM))
    .sort((a,b)=>(a.day||99)-(b.day||99));
}

function render(){
  const isCur=viewY===now.getFullYear()&&viewM===now.getMonth();
  const today=now.getDate();
  const list=monthTasks();
  const done=list.filter(t=>completions[compKey(t.id,viewY,viewM)]).length;
  const total=list.length;
  const pct=total?Math.round(done/total*100):0;

  let h="";
  h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
    <button class="arrow" onclick="chMonth(-1)">‹</button>
    <div style="text-align:center;">
      <div style="font-size:12px;letter-spacing:3px;color:var(--accent);font-weight:700;">매년 반복 · ${viewY}</div>
      <div class="serif" style="font-size:46px;font-weight:700;line-height:1.1;">${MONTHS_KR[viewM]}</div>
    </div>
    <button class="arrow" onclick="chMonth(1)">›</button>
  </div>`;

  h+=`<div style="text-align:center;margin-bottom:18px;">`+
     (isCur?`<span class="pill">이번 달이에요</span>`
           :`<button class="pill" onclick="goToday()">오늘 달로 돌아가기</button>`)+`</div>`;

  h+=`<div class="card" style="padding:14px 16px;margin-bottom:18px;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
      <span style="font-size:13px;color:var(--soft);">이번 달 진행</span>
      <span class="serif" style="font-size:17px;"><b style="color:var(--done);">${done}</b> / ${total} 완료</span>
    </div>
    <div style="height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden;">
      <div style="width:${pct}%;height:100%;background:${pct===100?"var(--done)":"var(--accent)"};border-radius:99px;transition:width .35s;"></div>
    </div>
  </div>`;

  if(list.length===0){
    h+=`<div class="card" style="padding:32px 16px;text-align:center;color:var(--soft);">
      <div class="serif" style="font-size:18px;margin-bottom:6px;">이 달엔 등록된 일이 없어요</div>
      <div style="font-size:13px;">아래 버튼으로 챙길 일을 추가해보세요.</div></div>`;
  }

  list.forEach((t,i)=>{
    const isDone=!!completions[compKey(t.id,viewY,viewM)];
    const overdue=isCur&&!isDone&&t.day&&t.day<today;
    const isToday=isCur&&t.day===today;
    h+=`<div class="item card" style="padding:13px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;opacity:${isDone?0.62:1};border-color:${overdue?"var(--accent)":"var(--line)"};animation-delay:${i*50}ms;" onclick="toggle('${t.id}')">
      <div style="width:26px;height:26px;border-radius:50%;flex-shrink:0;border:2px solid ${isDone?"var(--done)":"var(--accent)"};background:${isDone?"var(--done)":"transparent"};display:flex;align-items:center;justify-content:center;${isDone?"animation:pop .3s;":""}">
        ${isDone?'<span style="color:#fff;font-size:15px;font-weight:700;">✓</span>':''}
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:15.5px;${isDone?"text-decoration:line-through;":""}word-break:keep-all;">${esc(t.name)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center;">
          ${t.day?`<span class="dayBadge">${t.day}일</span>`:""}
          ${!t.everyMonth?`<span class="dayBadge" style="background:transparent;border:1px solid var(--line);color:var(--soft);">특정 월</span>`:""}
          ${isToday&&!isDone?`<span class="tag" style="background:var(--accent);color:#fff;">오늘</span>`:""}
          ${overdue?`<span class="tag" style="background:#fff;color:var(--accent);border:1px solid var(--accent);">놓치지 마세요</span>`:""}
          ${t.note?`<span style="font-size:12px;color:var(--soft);">· ${esc(t.note)}</span>`:""}
        </div>
      </div>
      <button style="background:none;border:none;color:var(--soft);font-size:17px;padding:4px;" onclick="event.stopPropagation();openEdit('${t.id}')">✎</button>
    </div>`;
  });

  h+=`<button class="addBtn" onclick="openAdd()">＋ 챙길 일 추가</button>`;
  h+=`<p style="font-size:11.5px;color:var(--soft);text-align:center;margin-top:18px;line-height:1.6;">기록은 이 기기에 자동 저장돼요.</p>`;

  document.getElementById("app").innerHTML=h;
}

function chMonth(d){let m=viewM+d,y=viewY;if(m<0){m=11;y--;}if(m>11){m=0;y++;}viewM=m;viewY=y;render();}
function goToday(){viewM=now.getMonth();viewY=now.getFullYear();render();}
function toggle(id){const k=compKey(id,viewY,viewM);if(completions[k])delete completions[k];else completions[k]=true;save();render();}

function openAdd(){editing=null;fEvery=true;fMonths=[viewM];showSheet({name:"",day:"",note:""});}
function openEdit(id){const t=tasks.find(x=>x.id===id);if(!t)return;editing=t;fEvery=!!t.everyMonth;fMonths=(t.months||[]).slice();showSheet({name:t.name,day:t.day?String(t.day):"",note:t.note||""});}

function showSheet(v){
  const ov=document.getElementById("overlay");
  let mh="";
  MONTHS_KR.forEach((m,idx)=>{mh+=`<button class="mbtn ${fMonths.includes(idx)?'on':''}" onclick="toggleM(${idx})">${m}</button>`;});
  document.getElementById("sheet").innerHTML=`
    <div style="width:40px;height:4px;background:var(--line);border-radius:9px;margin:0 auto 16px;"></div>
    <div class="serif" style="font-size:22px;font-weight:700;margin-bottom:16px;">${editing?"할 일 수정":"새 할 일"}</div>
    <label class="lbl">이름</label>
    <input id="fName" class="inp" placeholder="예) 자동차 보험 갱신" value="${esc(v.name)}" />
    <label class="lbl">며칠에? (선택)</label>
    <input id="fDay" class="inp" inputmode="numeric" placeholder="예) 25  →  매달 25일" value="${esc(v.day)}" />
    <label class="lbl">언제 반복?</label>
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <button id="segEvery" class="seg ${fEvery?'on':''}" onclick="setEvery(true)">매달</button>
      <button id="segSome" class="seg ${!fEvery?'on':''}" onclick="setEvery(false)">특정 월만</button>
    </div>
    <div id="monthGrid" style="display:${fEvery?'none':'grid'};grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px;">${mh}</div>
    <label class="lbl">메모 (선택)</label>
    <input id="fNote" class="inp" style="margin-bottom:18px;" placeholder="예) 계좌이체로" value="${esc(v.note)}" />
    <div style="display:flex;gap:10px;">
      ${editing?`<button onclick="removeTask('${editing.id}')" style="padding:14px 18px;border-radius:12px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;">삭제</button>`:""}
      <button onclick="saveForm()" style="flex:1;padding:14px;border-radius:12px;border:none;background:var(--ink);color:var(--paper);font-size:16px;font-weight:700;">${editing?"저장":"추가하기"}</button>
    </div>`;
  ov.style.display="flex";
  ov.onclick=e=>{if(e.target===ov)closeSheet();};
}
function closeSheet(){document.getElementById("overlay").style.display="none";}
function setEvery(v){fEvery=v;document.getElementById("segEvery").classList.toggle("on",v);document.getElementById("segSome").classList.toggle("on",!v);document.getElementById("monthGrid").style.display=v?"none":"grid";}
function toggleM(idx){if(fMonths.includes(idx))fMonths=fMonths.filter(x=>x!==idx);else fMonths.push(idx);
  const grid=document.getElementById("monthGrid");[...grid.children].forEach((b,i)=>b.classList.toggle("on",fMonths.includes(i)));}
function saveForm(){
  const name=document.getElementById("fName").value.trim();if(!name)return;
  let day=parseInt(document.getElementById("fDay").value,10);if(isNaN(day)||day<1||day>31)day=null;
  const note=document.getElementById("fNote").value.trim();
  const months=fEvery?[]:fMonths.slice().sort((a,b)=>a-b);
  if(!fEvery&&months.length===0)return;
  if(editing){tasks=tasks.map(t=>t.id===editing.id?{...t,name,day,everyMonth:fEvery,months,note}:t);}
  else{tasks.push({id:uid(),name,day,everyMonth:fEvery,months,note});}
  save();closeSheet();render();
}
function removeTask(id){tasks=tasks.filter(t=>t.id!==id);
  const nc={};for(const k in completions)if(!k.startsWith(id+"__"))nc[k]=completions[k];completions=nc;
  save();closeSheet();render();}

load();render();
</script>
</body>
</html>
